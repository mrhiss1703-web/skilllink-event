<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Cổng Quản Trị | SkillLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 150px;
      height: auto;
      margin-bottom: 24px;
      opacity: 0.98;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 184, 0, 0.2);
      border-top-color: #FFB800;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .text {
      font-size: 0.92rem;
      color: #b0b0b0;
      font-weight: 500;
    }
    .fallback {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #707070;
    }
    .fallback a {
      color: #FFB800;
      text-decoration: none;
      font-weight: 600;
    }
    .fallback a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body data-portal-route="/attendance/management">
  <img src="LOGO ÁO trắng NỀN đen.png" alt="SkillLink Logo" class="logo">
  <div class="spinner"></div>
  <p class="text">Đang chuyển tiếp sang Cổng Quản Trị...</p>
  <p class="fallback">Nếu trang không tự chuyển, <a id="portal-link" href="#">bấm vào đây</a>.</p>
  <p class="fallback" style="margin-top: 8px;"><a href="index.html" style="color: #94a3b8;">← Quay lại Trang Chủ SkillLink</a></p>

  <script src="assets/js/portal-config.js"></script>
  <script type="module" src="assets/js/portal-redirect.js"></script>
</body>
</html>
